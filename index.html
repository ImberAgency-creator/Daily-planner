<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#2f5d50">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#76736b;--line:#e6e3da;--accent:#2f5d50;--accent-soft:#e3eee9;--warn:#b4532a;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#201f1c;--ink:#f1efe8;--mute:#9b978c;--line:#34322d;--accent:#7fc4ad;--accent-soft:#25362f;--warn:#e08a5e;--on:#10221c}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:650}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
.nav button.today{color:var(--accent);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 20px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:600}
.p1{color:#d64545}.p2{color:#d9a21b}.p3{color:#3b82c4}
.pick button{display:inline-flex;align-items:center;gap:6px}
.pick button.on{background:var(--bg);border-width:2px}
.pick button.on.p1{border-color:#d64545}.pick button.on.p2{border-color:#d9a21b}.pick button.on.p3{border-color:#3b82c4}
.pick button.p1,.pick button.p2,.pick button.p3{color:var(--ink)}
.pick svg{flex:none}
.flag{background:none;border:0;padding:4px;cursor:pointer;display:grid;place-items:center;flex:none;line-height:0}
.flagi{display:grid;place-items:center;flex:none;line-height:0}
input[type=text],input[type=time]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=time]{width:auto;flex:none}
input:focus{outline:2px solid var(--accent);outline-offset:0}
.add{display:flex;gap:8px;margin-bottom:12px}
.add button{flex:none;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 16px;font-size:20px;cursor:pointer}
@media(prefers-color-scheme:dark){.add button{color:#10221c}}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.t{flex:1;min-width:0;word-break:break-word}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;flex:none}
li.done .t{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.carry{display:none;width:100%;margin-bottom:16px;background:var(--card);border:1px dashed var(--warn);color:var(--warn);border-radius:12px;padding:10px;font:inherit;cursor:pointer}
textarea{width:100%;min-height:80px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
summary{cursor:pointer;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{font:inherit;font-size:13px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer}
.chips button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.rep{color:var(--accent);font-size:13px;flex:none}
.days{color:var(--mute);font-size:12px;flex:none}
.note{color:var(--mute);font-size:12px;text-align:center;margin-top:8px}
#list li{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
li.wrap{flex-wrap:wrap}
.hist{display:flex;align-items:center;gap:4px;flex-basis:100%;padding-left:2px}
.hd{width:28px;height:24px;border-radius:7px;font-size:10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--mute)}
.hd.done{background:var(--accent);border-color:var(--accent);color:var(--on)}
.hd.miss{border-color:var(--warn);color:var(--warn)}
.hd.pending{border-color:var(--accent);color:var(--accent)}
.hd.off,.hd.na,.hd.skip{opacity:.35}
.streak{margin-left:6px;font-size:12px;color:var(--accent)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.sheet-card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.sheet-title{font-weight:600;word-break:break-word}
.sheet-hint{display:none;color:var(--mute);font-size:13px;margin:6px 0 4px}
.sheet-card button{display:block;width:100%;font:inherit;padding:12px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.sheet-card button.danger{color:var(--warn);border-color:var(--warn)}
.sheet-card form{margin-top:10px}
.sheet-card input{-webkit-user-select:text;user-select:text}
.sheet-card .srow{display:flex;gap:8px}
.sheet-card .srow button{flex:1}
.sheet-card button.go{background:var(--accent);border-color:var(--accent);color:var(--on)}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Imad’s daily tasks</h1>
    <div class="nav"><button id="prev" aria-label="Previous day">&larr;</button> <button id="today" class="today">Today</button> <button id="next" aria-label="Next day">&rarr;</button></div>
  </header>
  <p class="sub" id="sub"></p>
  <div class="bar"><i id="bar"></i></div>

  <button class="carry" id="carry"></button>

  <section>
    <h2>Schedule and tasks</h2>
    <form class="add" id="form">
      <input type="time" id="when" aria-label="Time (optional)">
      <input type="text" id="what" placeholder="Add a task" autocomplete="off" aria-label="Task">
      <button type="submit" aria-label="Add">+</button>
    </form>
    <div class="chips pick" id="pick"></div>
    <ul id="list"></ul>
    <div class="empty" id="empty">Nothing planned yet.</div>
  </section>

  <section>
    <details id="rdet">
      <summary>Daily routine (repeats automatically)</summary>
      <form class="add" id="rform" style="margin-top:12px">
        <input type="time" id="rwhen" aria-label="Time (optional)">
        <input type="text" id="rwhat" placeholder="e.g. Check LinkedIn" autocomplete="off" aria-label="Routine task">
        <button type="submit" aria-label="Add routine">+</button>
      </form>
      <div class="chips" id="chips"></div>
      <ul id="rlist"></ul>
    </details>
  </section>

  <section>
    <h2>Notes</h2>
    <textarea id="notes" placeholder="Ideas, links, things to follow up on"></textarea>
  </section>
  <p class="note">Saved in this browser only. Clearing site data erases it.</p>
</main>

<div id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <div class="sheet-title" id="sTitle"></div>
    <p class="sheet-hint" id="sHint">Daily routine: re-writing renames it on all days from today. Delete removes it for this day only.</p>
    <div id="sMenu">
      <button type="button" id="sEdit">Re-write</button>
      <button type="button" id="sDelete" class="danger">Delete</button>
      <button type="button" id="sCancel">Cancel</button>
    </div>
    <form id="sForm" hidden>
      <input type="text" id="sText" autocomplete="off" aria-label="Task text">
      <div class="srow"><button type="submit" class="go">Save</button><button type="button" id="sBack">Cancel</button></div>
    </form>
  </div>
</div>

<script>
(function(){
  var KEY='daily-planner-v1';
  var mem={};
  function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):{}}catch(e){return mem}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){mem=data}}
  var data=load();
  function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
  function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  var todayIso=iso(new Date());
  var cur=todayIso;
  function day(k){k=k||cur;if(!data[k])data[k]={prios:['','',''],tasks:[],notes:''};return data[k]}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  var $=function(id){return document.getElementById(id)};
  var ORDER=[1,2,3,4,5,6,0],DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var sel=[1,2,3,4,5];
  function prio(t){var p=+t.p;return t.rid?1:(p===1||p===2||p===3?p:3)}
  var pri=3;
  function renderPick(){
    var c=$('pick');c.innerHTML='';
    [1,2,3].forEach(function(p){
      var b=document.createElement('button');b.type='button';
      b.className='p'+p+(pri===p?' on':'');
      b.innerHTML=flagSvg(p)+'<span>'+PN[p]+'</span>';
      b.setAttribute('aria-label',PN[p]+' priority');
      b.onclick=function(){pri=p;renderPick()};
      c.appendChild(b);
    });
  }
  var PN={1:'High',2:'Medium',3:'Low'};
  function flagSvg(p){return '<svg class="p'+p+'" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 3v18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M5 4h13l-3 4.2 3 4.2H5z" fill="currentColor"/></svg>'}
  function routine(){if(!data._routine)data._routine=[];return data._routine}
  function applyRoutine(k){
    if(k<todayIso)return;
    var d=day(k);
    if(!d.applied){d.applied=[];d.tasks.forEach(function(t){if(t.rid&&d.applied.indexOf(t.rid)<0)d.applied.push(t.rid)})}
    var wd=parse(k).getDay(),changed=false;
    routine().forEach(function(r){
      if(d.applied.indexOf(r.id)>-1||r.days.indexOf(wd)<0)return;
      d.tasks.push({id:uid(),rid:r.id,text:r.text,time:r.time||'',p:1,done:false});
      d.applied.push(r.id);changed=true;
    });
    if(changed)save();
  }
  function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return iso(d)}
  function ensureCreated(r){
    if(r.created)return;
    var first=Object.keys(data).filter(function(k){return k!=='_routine'&&data[k].tasks&&data[k].tasks.some(function(t){return t.rid===r.id})}).sort()[0];
    r.created=first||todayIso;save();
  }
  function rstatus(r,k){
    if(k<r.created)return 'na';
    if(r.days.indexOf(parse(k).getDay())<0)return 'off';
    var e=data[k],t=e&&e.tasks.filter(function(x){return x.rid===r.id})[0];
    if(t)return t.done?'done':(k===todayIso?'pending':'miss');
    if(e&&e.applied&&e.applied.indexOf(r.id)>-1)return 'skip';
    return k===todayIso?'pending':'miss';
  }
  function streak(r){
    var n=0,k=todayIso;
    for(var i=0;i<400;i++,k=addDays(k,-1)){
      var st=rstatus(r,k);
      if(st==='na'||st==='miss')break;
      if(st==='done')n++;
    }
    return n;
  }
  function renderRoutine(){
    var c=$('chips');c.innerHTML='';
    ORDER.forEach(function(n){
      var b=document.createElement('button');b.type='button';b.textContent=DN[n];
      if(sel.indexOf(n)>-1)b.className='on';
      b.onclick=function(){var i=sel.indexOf(n);if(i>-1)sel.splice(i,1);else sel.push(n);renderRoutine()};
      c.appendChild(b);
    });
    var ul=$('rlist');ul.innerHTML='';
    routine().forEach(function(r){
      ensureCreated(r);
      var li=document.createElement('li');li.className='wrap';
      var fi=document.createElement('span');fi.className='flagi';fi.innerHTML=flagSvg(1);fi.title='High priority';li.appendChild(fi);
      if(r.time){var tm=document.createElement('span');tm.className='time';tm.textContent=r.time;li.appendChild(tm)}
      var tx=document.createElement('span');tx.className='t';tx.textContent=r.text;li.appendChild(tx);
      var dd=document.createElement('span');dd.className='days';
      dd.textContent=r.days.length===7?'Daily':ORDER.filter(function(n){return r.days.indexOf(n)>-1}).map(function(n){return DN[n]}).join(' ');
      li.appendChild(dd);
      var x=document.createElement('button');x.className='x';x.textContent='\u00d7';x.setAttribute('aria-label','Delete routine');
      x.onclick=function(){
        data._routine=routine().filter(function(y){return y.id!==r.id});
        Object.keys(data).forEach(function(k){if(k!=='_routine'&&k>=todayIso)data[k].tasks=data[k].tasks.filter(function(t){return !(t.rid===r.id&&!t.done)})});
        save();render();
      };
      li.appendChild(x);
      var h=document.createElement('div');h.className='hist';
      for(var i=6;i>=0;i--){
        var k=addDays(todayIso,-i),st=rstatus(r,k);
        var sq=document.createElement('span');sq.className='hd '+st;
        sq.textContent=DN[parse(k).getDay()].slice(0,2);sq.title=k+' ('+st+')';h.appendChild(sq);
      }
      var sk=document.createElement('span');sk.className='streak';sk.textContent='Streak: '+streak(r);h.appendChild(sk);
      li.appendChild(h);ul.appendChild(li);
    });
  }

  function render(){
    applyRoutine(cur);
    var d=day();
    var dt=parse(cur);
    $('sub').textContent=dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    var done=d.tasks.filter(function(t){return t.done}).length;
    $('bar').style.width=(d.tasks.length?Math.round(done/d.tasks.length*100):0)+'%';

    var tasks=d.tasks.slice().sort(function(a,b){
      if(a.done!==b.done)return a.done?1:-1;
      var pa=prio(a),pb=prio(b);
      if(a.time&&b.time)return a.time!==b.time?(a.time<b.time?-1:1):pa-pb;
      if(a.time)return -1;if(b.time)return 1;return pa-pb;
    });
    var ul=$('list');ul.innerHTML='';
    tasks.forEach(function(t){
      var li=document.createElement('li');if(t.done)li.className='done';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;
      cb.addEventListener('change',function(){t.done=cb.checked;save();render()});
      li.appendChild(cb);
      var p=prio(t),fl;
      if(t.rid){fl=document.createElement('span');fl.className='flagi';fl.title='High priority (daily routine)'}
      else{fl=document.createElement('button');fl.type='button';fl.className='flag';
        fl.setAttribute('aria-label',PN[p]+' priority. Tap to change');fl.title=PN[p]+' priority';
        fl.addEventListener('click',function(){t.p=p===1?3:p-1;save();render()})}
      fl.innerHTML=flagSvg(p);
      li.appendChild(fl);
      if(t.time){var tm=document.createElement('span');tm.className='time';tm.textContent=t.time;li.appendChild(tm)}
      if(t.rid){var rp=document.createElement('span');rp.className='rep';var rt=routine().filter(function(r){return r.id===t.rid})[0],sn=0;if(rt){ensureCreated(rt);sn=streak(rt)}rp.textContent='\u21bb'+(sn>=2?' '+sn:'');li.appendChild(rp)}
      var tx=document.createElement('span');tx.className='t';tx.textContent=t.text;li.appendChild(tx);
      var x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','Delete');
      x.addEventListener('click',function(){d.tasks=d.tasks.filter(function(y){return y.id!==t.id});save();render()});
      li.appendChild(x);ul.appendChild(li);
      attachPress(li,t);
    });
    $('empty').style.display=d.tasks.length?'none':'block';
    $('notes').value=d.notes||'';
    renderRoutine();

    // carry over unfinished tasks from yesterday (only when viewing today)
    var btn=$('carry');btn.style.display='none';
    if(cur===todayIso){
      var y=new Date();y.setDate(y.getDate()-1);var yd=data[iso(y)];
      if(yd){
        var open=yd.tasks.filter(function(t){return !t.done&&!t.carried&&!t.rid});
        if(open.length){btn.style.display='block';btn.textContent='Carry over '+open.length+' unfinished task'+(open.length>1?'s':'')+' from yesterday';
          btn.onclick=function(){
            open.forEach(function(t){t.carried=true;day().tasks.push({id:uid(),text:t.text,time:'',p:t.p||3,done:false})});
            save();render();
          };
        }
      }
    }
  }

  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var text=$('what').value.trim();if(!text)return;
    day().tasks.push({id:uid(),text:text,time:$('when').value,p:pri,done:false});
    $('what').value='';$('when').value='';save();render();$('what').focus();
  });
  $('rform').addEventListener('submit',function(e){
    e.preventDefault();
    var text=$('rwhat').value.trim();if(!text||!sel.length)return;
    var r={id:uid(),text:text,time:$('rwhen').value,days:sel.slice(),p:1,created:todayIso};
    routine().push(r);
    $('rwhat').value='';$('rwhen').value='';save();render();
  });
  $('notes').addEventListener('input',function(){day().notes=$('notes').value;save()});
  // ----- long press: re-write or delete -----
  var sheetTask=null,sheetAt=0;
  function openSheet(t){
    sheetTask=t;sheetAt=Date.now();
    $('sTitle').textContent=t.text;
    $('sHint').style.display=t.rid?'block':'none';
    $('sMenu').hidden=false;$('sForm').hidden=true;$('sheet').hidden=false;
  }
  function closeSheet(){$('sheet').hidden=true;sheetTask=null}
  function attachPress(li,t){
    var timer=null,sx=0,sy=0;
    function clear(){if(timer){clearTimeout(timer);timer=null}}
    li.addEventListener('touchstart',function(e){
      if(e.target.closest('input,button'))return;
      var p=e.touches[0];sx=p.clientX;sy=p.clientY;clear();
      timer=setTimeout(function(){timer=null;openSheet(t)},500);
    },{passive:true});
    li.addEventListener('touchmove',function(e){var p=e.touches[0];if(Math.abs(p.clientX-sx)>10||Math.abs(p.clientY-sy)>10)clear()},{passive:true});
    li.addEventListener('touchend',clear);
    li.addEventListener('touchcancel',clear);
    li.addEventListener('contextmenu',function(e){if(e.target.closest('input,button'))return;e.preventDefault();openSheet(t)});
  }
  $('sheet').addEventListener('click',function(e){if(e.target===$('sheet')&&Date.now()-sheetAt>450)closeSheet()});
  $('sCancel').onclick=closeSheet;
  $('sBack').onclick=closeSheet;
  $('sEdit').onclick=function(){$('sMenu').hidden=true;$('sForm').hidden=false;$('sText').value=sheetTask.text;$('sText').focus();$('sText').select()};
  $('sDelete').onclick=function(){
    var t=sheetTask,d=day();
    d.tasks=d.tasks.filter(function(y){return y.id!==t.id});
    save();closeSheet();render();
  };
  $('sForm').addEventListener('submit',function(e){
    e.preventDefault();
    var text=$('sText').value.trim();if(!text||!sheetTask)return;
    var t=sheetTask;t.text=text;
    if(t.rid){
      var r=routine().filter(function(x){return x.id===t.rid})[0];
      if(r){
        r.text=text;
        Object.keys(data).forEach(function(k){
          if(k!=='_routine'&&k>=todayIso&&data[k].tasks)data[k].tasks.forEach(function(x){if(x.rid===r.id&&!x.done)x.text=text});
        });
      }
    }
    save();closeSheet();render();
  });

  function shift(n){var d=parse(cur);d.setDate(d.getDate()+n);cur=iso(d);render()}
  $('prev').onclick=function(){shift(-1)};
  $('next').onclick=function(){shift(1)};
  $('today').onclick=function(){cur=todayIso;render()};
  renderPick();
  render();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
